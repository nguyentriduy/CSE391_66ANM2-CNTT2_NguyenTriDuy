<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý điểm sinh viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark text-white px-4">
    <span class="navbar-brand">Trường Đại học Thủy lợi</span>
    <div>
      <a class="text-white me-3" href="#">Trang chủ</a>
      <a class="text-white me-3" href="#">Quản lý điểm</a>
    </div>
  </nav>

  <div class="container my-4">
    <h3 class="mb-4 text-center">BẢNG ĐIỂM SINH VIÊN</h3>

    <div class="card mb-4">
      <div class="card-body d-flex gap-3 align-items-end">
        <div class="flex-grow-1">
          <label for="hoTen" class="form-label fw-bold">Họ tên sinh viên</label>
          <input type="text" id="hoTen" class="form-control" placeholder="Nhập họ tên...">
        </div>
        <div class="flex-grow-1">
          <label for="diem" class="form-label fw-bold">Điểm số (0 - 10)</label>
          <input type="number" id="diem" class="form-control" placeholder="Nhập điểm..." step="0.1" min="0" max="10">
        </div>
        <div>
          <button class="btn btn-primary px-4" id="btnAdd">Thêm</button>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-8">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 Tìm kiếm theo họ tên...">
      </div>
      <div class="col-md-4">
        <select id="filterSelect" class="form-select">
          <option value="Tất cả">Tất cả xếp loại</option>
          <option value="Giỏi">Giỏi</option>
          <option value="Khá">Khá</option>
          <option value="Trung bình">Trung bình</option>
          <option value="Yếu">Yếu</option>
        </select>
      </div>
    </div>

    <div class="table-wrapper">
      <table class="table table-bordered text-center align-middle">
        <thead class="table-dark">
          <tr>
            <th>STT</th>
            <th>Họ tên</th>
            <th id="sortDiem" style="cursor: pointer;" title="Nhấn để sắp xếp">Điểm <span id="sortIcon"></span></th>
            <th>Xếp loại</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="dataTable">
          </tbody>
      </table>
    </div>

    <div class="mt-3 p-3 bg-light border rounded d-flex justify-content-between">
      <span class="fw-bold text-primary fs-5" id="tongSinhVien">Tổng số sinh viên: 0</span>
      <span class="fw-bold text-danger fs-5" id="diemTrungBinh">Điểm trung bình: 0.0</span>
    </div>
  </div>

  <footer class="footer bg-primary text-white py-3 mt-auto">
    <p>TRƯỜNG ĐẠI HỌC THỦY LỢI<br>
    175 Tây Sơn, Đống Đa, Hà Nội<br>
    Điện thoại: (024) 38522201, Fax: (024) 35633351<br>
    Email: phonghcth@tlu.edu.vn</p>
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
