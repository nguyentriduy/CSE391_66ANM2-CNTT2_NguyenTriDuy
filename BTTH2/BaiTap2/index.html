<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe's Travel Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-wrapper">
        <header>
            <div class="logo">TRAVEL GOALS</div>
            <nav>
                <a href="#">Destinations</a>
                <a href="#">About</a>
            </nav>
        </header>

        <main class="hero">
            <div class="hero-content">
                <h1>JOE'S TRAVEL PAGE</h1>
                <p>LET'S EXPLORE THE WORLD TOGETHER!</p>
                <button class="btn-discover">Discover places</button>
            </div>
        </main>
    </div>

    <section class="highlights">
        <h2 class="section-title">HIGHLIGHTS</h2>
        <div class="destinations-grid">
            <div class="card">
                <img src="image/miami.jpg" alt="Miami">
                <p>MIAMI <span class="country">USA</span></p>
            </div>
            <div class="card">
                <img src="image/munich.jpg" alt="Munich">
                <p>MUNICH <span class="country">GERMANY</span></p>
            </div>
            <div class="card">
                <img src="image/barcelona.jpg" alt="Barcelona">
                <p>BARCELONA <span class="country">SPAIN</span></p>
            </div>
        </div>
    </section>

    <footer>
        <div class="social-icons">
            <img src="image/insta.png" alt="Instagram" class="white-icon">
            <img src="image/facebook.png" alt="Facebook" class="white-icon">
        </div>
    </footer>

</body>
</html>
