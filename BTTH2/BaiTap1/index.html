<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Contact Form Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="outer-box">
        <h2 class="form-title">Get in touch with us by filling contact form below</h2>
        
        <form class="contact-form">
            <div class="input-group">
                <input type="text" placeholder="* Enter your full name" required>
                <input type="email" placeholder="* Enter your email address" required>
            </div>

            <div class="input-group">
                <input type="text" placeholder="Enter your subject" class="full-width">
            </div>

            <div class="input-group">
                <textarea placeholder="* Your message here..." rows="8"></textarea>
            </div>

            <div class="form-footer">
                <button type="submit" class="btn-send">Send message</button>
                <span class="required-note">* Please fill all required form field, thanks!</span>
            </div>
        </form>
    </div>

</body>
</html>
